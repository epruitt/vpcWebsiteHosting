name: Terraform PR Check

on:
  pull_request:
    branches:
      - main
    paths:
      - 'vpcWebsiteHosting/**.tf'
      - 'vpcWebsiteHosting/**.tfvars'
      - 'vpcWebsiteHosting/agent-config.json'
      - 'vpcWebsiteHosting-bootstrap/**.tf'
      - 'vpcWebsiteHosting-bootstrap/**.tfvars'
      - 'vpcWebsiteHosting-bootstrap/agent-config.json'


# Permissions required for OIDC and PR comments
permissions:
  id-token: write      # Required for OIDC authentication with AWS
  contents: read
  pull-requests: write # Required to post comments on the PR

defaults:
  run:
    working-directory: vpcWebsiteHosting

env:
  TF_IN_AUTOMATION: true

jobs:
  # Job 1: Format & Validate
  format-validate:
    name: Format & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        # Backend bucket/key/region/encrypt/use_lockfile are already fully
        # specified in c1-versions.tf, so no -backend-config flags needed.
        # Read access to the state bucket comes from the plan role assumed above.
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

  # Job 2: Security Scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: vpcWebsiteHosting
          framework: terraform
          soft_fail: false
          # Scan broadly and gate on severity rather than an explicit
          # check-ID allowlist, so new/unlisted findings aren't silently skipped.
          check: CRITICAL,HIGH
          output_format: cli

      - name: Terraform Plan
        id: plan
        env:
          TF_VAR_alert_email: ${{ secrets.TF_VAR_ALERT_EMAIL }}
        run: |
          set +e
          terraform plan -no-color -input=false -out=tfplan > plan_output.txt 2>&1
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"

      - name: Truncate Plan Output
        if: always()
        run: |
          # Keep the tail of the output (most relevant for errors/diffs),
          # capped well under GitHub's PR comment size limit.
          tail -c 60000 plan_output.txt > plan_truncated.txt

      - name: Upload Plan Artifact
        # Full (untruncated) output kept as an artifact for cases where
        # the PR comment truncation cuts off something important.
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            vpcWebsiteHosting/tfplan
            vpcWebsiteHosting/plan_output.txt
          retention-days: 5

      - name: Post Plan to PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const exitcode = '${{ steps.plan.outputs.exitcode }}';
            const icon = exitcode === '0' ? '✅' : '❌';

            let plan = '';
            try {
              plan = fs.readFileSync('vpcWebsiteHosting/plan_truncated.txt', 'utf8');
            } catch (e) {
              plan = `Could not read plan output: ${e.message}`;
            }

            const truncated = plan.length >= 59999;

            const output = `#### Terraform Plan 📖 ${icon}
            <details><summary>Show Plan</summary>

            \`\`\`hcl
            ${plan}
            \`\`\`
            ${truncated ? '\n_Output truncated — see the `tfplan` workflow artifact for the full plan._' : ''}
            </details>

            *Generated by GitHub Actions*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fail Job on Plan Error
        if: steps.plan.outputs.exitcode != '0'
        run: exit 1