name: Terraform PR Check

on:
  pull_request:
    branches:
      - main
    paths:
      - 'vpcWebsiteHosting/**.tf'
      - 'vpcWebsiteHosting/**.tfvars'
      - 'vpcWebsiteHosting/agent-config.json'
      - 'vpcWebsiteHosting-bootstrap/**.tf'
      - 'vpcWebsiteHosting-bootstrap/**.tfvars'
      - 'vpcWebsiteHosting-bootstrap/agent-config.json'


# Permissions required for OIDC and PR comments
permissions:
  id-token: write      # Required for OIDC authentication with AWS
  contents: read
  pull-requests: write # Required to post comments on the PR

defaults:
  run:
    working-directory: vpcWebsiteHosting

env:
  TF_IN_AUTOMATION: true

jobs:
  # Job 1: Format & Validate
  format-validate:
    name: Format & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        # Backend bucket/key/region/encrypt/use_lockfile are already fully
        # specified in c1-versions.tf, so no -backend-config flags needed.
        # Read access to the state bucket comes from the plan role assumed above.
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

  # Job 2: Security Scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: vpcWebsiteHosting
          framework: terraform
          soft_fail: false
          # Scan broadly and gate on severity rather than an explicit
          # check-ID allowlist, so new/unlisted findings aren't silently skipped.
          check: CRITICAL,HIGH
          output_format: cli

  # Job 3: Plan & Comment
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: [format-validate, security-scan] # Ensures plan only runs if previous checks pass
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan
        id: plan
        env:
          TF_VAR_alert_email: ${{ secrets.TF_VAR_ALERT_EMAIL }}
        run: terraform plan -no-color -input=false -out=tfplan
        continue-on-error: true # Allow job to complete so the comment step can post either way

      - name: Upload Plan Artifact
        # Full plan output can exceed GitHub's PR comment size limit,
        # so the raw plan file is kept as an artifact and the comment
        # below is truncated.
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: vpcWebsiteHosting/tfplan
          retention-days: 5

      - name: Post Plan to PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const outcome = `${{ steps.plan.outcome }}`;
            const icon = outcome === 'success' ? '✅' : '❌';

            let plan = `${{ steps.plan.outputs.stdout }}${{ steps.plan.outputs.stderr }}`;
            const maxLen = 60000; // stay under GitHub's ~65KB comment limit
            let truncated = false;
            if (plan.length > maxLen) {
              plan = plan.slice(plan.length - maxLen);
              truncated = true;
            }

            const output = `#### Terraform Plan 📖 ${icon}
            <details><summary>Show Plan</summary>

            \`\`\`hcl
            ${plan}
            \`\`\`
            ${truncated ? '\n_Output truncated — see the `tfplan` workflow artifact for the full plan._' : ''}
            </details>

            *Generated by GitHub Actions*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fail Job on Plan Error
        # continue-on-error above lets the comment post regardless of outcome,
        # but the job (and therefore the required PR check) must still fail
        # if plan itself errored, not just if it showed changes.
        if: steps.plan.outcome == 'failure'
        run: exit 1