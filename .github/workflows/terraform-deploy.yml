name: Terraform Deploy to Production

on:
  push:
    branches:
      - main
    paths:
      - 'vpcWebsiteHosting/**.tf'
      - 'vpcWebsiteHosting/**.tfvars'
      - 'vpcWebsiteHosting/agent-config.json'
      - 'vpcWebsiteHosting-bootstrap/**.tf'
      - 'vpcWebsiteHosting-bootstrap/**.tfvars'
      - 'vpcWebsiteHosting-bootstrap/agent-config.json'

concurrency:
  group: terraform-production-apply
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write
  pull-requests: read

env:
  TF_IN_AUTOMATION: true
  AWS_REGION: us-east-2

jobs:
  test:
    name: Test & Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vpcWebsiteHosting
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        env:
          TF_VAR_alert_email: ${{ secrets.TF_VAR_ALERT_EMAIL }}
        run: |
          set +e
          terraform plan -no-color -input=false -out=tfplan > plan_output.txt 2>&1
          exitcode=$?
          cat plan_output.txt
          echo "exitcode=$exitcode" >> "$GITHUB_OUTPUT"
          exit $exitcode

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            vpcWebsiteHosting/tfplan
            vpcWebsiteHosting/plan_output.txt
          retention-days: 1

  approval:
    name: Production Approval
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Approved
        run: echo "Deployment approved by reviewer"

  apply:
    name: Terraform Apply
    needs: approval
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vpcWebsiteHosting
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: vpcWebsiteHosting

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

  smoke-test:
    name: Smoke Test
    needs: apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vpcWebsiteHosting
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init (Read Outputs)
        run: terraform init -input=false

      - name: Get ALB DNS Name
        id: alb
        run: |
          DNS_NAME=$(terraform output -raw alb_dns_name)
          echo "dns_name=$DNS_NAME" >> "$GITHUB_OUTPUT"
          echo "Testing endpoint: $DNS_NAME"

      - name: Wait for ALB Propagation
        run: sleep 30

      - name: HTTP Health Check
        run: |
          curl -sf --retry 5 --retry-delay 10 --retry-connrefused "http://${{ steps.alb.outputs.dns_name }}" || exit 1

      - name: Check Target Group Health
        run: |
          TG_ARN=$(terraform output -raw alb_target_group_arn)
          HEALTH=$(aws elbv2 describe-target-health --target-group-arn "$TG_ARN" --query 'TargetHealthDescriptions[0].TargetHealth.State' --output text)
          echo "Target Health State: $HEALTH"
          if [ "$HEALTH" != "healthy" ]; then
            echo "Target group is not healthy"
            exit 1
          fi

  tag-last-known-good:
    name: Tag Last Known Good
    needs: [apply, smoke-test]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move last-known-good Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f last-known-good
          git push -f origin last-known-good
          AUDIT_TAG="deployed-$(date +%Y%m%d-%H%M%S)"
          git tag "$AUDIT_TAG"
          git push origin "$AUDIT_TAG"

  rollback:
    name: Automated Rollback
    needs: [apply, smoke-test]
    if: failure() && needs.apply.result == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vpcWebsiteHosting
    steps:
      - name: Checkout Last Known Good
        uses: actions/checkout@v4
        with:
          ref: last-known-good
          fetch-depth: 0

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Rollback Apply
        env:
          TF_VAR_alert_email: ${{ secrets.TF_VAR_ALERT_EMAIL }}
        run: terraform apply -auto-approve -input=false

      - name: Notify Rollback via SNS
        run: |
          TOPIC_ARN=$(terraform output -raw sns_topic_arn)
          aws sns publish \
            --topic-arn "$TOPIC_ARN" \
            --message "AUTOMATED ROLLBACK TRIGGERED: Deploy or smoke test failed on commit ${{ github.sha }}. Infrastructure reverted to 'last-known-good' tag." \
            --subject "Terraform Rollback Notification"